<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TubeBrief - YouTube summaries in seconds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0f0b1e; --card:rgba(255,255,255,.07); --border:rgba(255,255,255,.14);
    --fg:#f4f2ff; --muted:#a9a3c9; --a:#ff4d6d; --b:#7c5cff;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; font-family:Inter,system-ui,sans-serif; color:var(--fg);
    background:
      radial-gradient(900px 500px at 15% -10%, rgba(124,92,255,.45), transparent 60%),
      radial-gradient(800px 500px at 90% 0%, rgba(255,77,109,.35), transparent 60%),
      var(--bg);
  }
  main { max-width:760px; margin:0 auto; padding:3.5rem 1.25rem 4rem; }
  .badge { display:inline-block; padding:.3rem .8rem; border:1px solid var(--border); border-radius:999px; font-size:.8rem; color:var(--muted); background:var(--card); }
  h1 { font-size:clamp(2.2rem,6vw,3.6rem); line-height:1.05; margin:1rem 0 .75rem; font-weight:800; letter-spacing:-.03em; }
  h1 span { background:linear-gradient(90deg,var(--a),var(--b)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .sub { color:var(--muted); font-size:1.1rem; max-width:34rem; margin:0 0 2rem; }
  .box { display:flex; gap:.6rem; padding:.5rem; background:var(--card); border:1px solid var(--border); border-radius:16px; backdrop-filter:blur(8px); }
  .box:focus-within { border-color:var(--b); box-shadow:0 0 0 4px rgba(124,92,255,.25); }
  input { flex:1; min-width:0; background:transparent; border:0; outline:0; color:var(--fg); font-size:1rem; padding:.8rem; font-family:inherit; }
  input::placeholder { color:var(--muted); }
  .go { border:0; border-radius:12px; padding:.8rem 1.4rem; font-weight:700; font-size:1rem; color:#fff; cursor:pointer; font-family:inherit;
        background:linear-gradient(90deg,var(--a),var(--b)); transition:transform .15s, filter .15s; }
  .go:hover { transform:translateY(-1px); filter:brightness(1.1); }
  .go:disabled { opacity:.7; cursor:wait; transform:none; }
  .hints { display:flex; gap:.5rem; flex-wrap:wrap; margin-top:1rem; color:var(--muted); font-size:.85rem; }
  .hints span { padding:.25rem .7rem; border:1px solid var(--border); border-radius:999px; }
  #error { margin-top:1rem; color:#ff8fa3; font-weight:500; }
  #loading { display:none; margin-top:2rem; text-align:center; color:var(--muted); }
  .spin { width:38px; height:38px; margin:0 auto 1rem; border-radius:50%; border:4px solid var(--border); border-top-color:var(--a); animation:s .8s linear infinite; }
  @keyframes s { to { transform:rotate(360deg); } }
  #out { display:none; margin-top:2rem; animation:up .5s ease; }
  @keyframes up { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }
  .video { display:flex; gap:1rem; align-items:center; padding:.75rem; background:var(--card); border:1px solid var(--border); border-radius:14px; margin-bottom:1rem; }
  .video img { width:128px; border-radius:8px; display:block; }
  .video a { color:var(--fg); font-weight:500; word-break:break-all; font-size:.9rem; }
  .summary { padding:1.4rem 1.6rem; background:var(--card); border:1px solid var(--border); border-radius:16px; line-height:1.65; }
  .summary h2 { font-size:1.05rem; margin:1.2rem 0 .4rem; background:linear-gradient(90deg,var(--a),var(--b)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .summary h2:first-child { margin-top:0; }
  .summary p { margin:.3rem 0; } .summary ul { margin:.3rem 0; padding-left:1.2rem; } .summary li { margin:.25rem 0; }
  .actions { display:flex; gap:.6rem; flex-wrap:wrap; margin-top:1rem; }
  .ghost { background:var(--card); border:1px solid var(--border); color:var(--fg); border-radius:10px; padding:.6rem 1rem; font-weight:500; cursor:pointer; font-family:inherit; font-size:.9rem; }
  .ghost:hover { border-color:var(--b); }
  footer { margin-top:3rem; color:var(--muted); font-size:.8rem; text-align:center; }
  @media (max-width:520px) { .box { flex-direction:column; } .video { flex-direction:column; align-items:flex-start; } }
</style>
</head>
<body>
<main>
  <span class="badge">Free &bull; Works without captions</span>
  <h1>Skip the watching.<br><span>Get the point.</span></h1>
  <p class="sub">Paste any YouTube link and get a clean summary with key points and takeaways, ready to download.</p>

  <div class="box">
    <input id="url" placeholder="https://www.youtube.com/watch?v=..." autofocus>
    <button class="go" id="go">Summarize</button>
  </div>
  <div class="hints"><span>Lectures</span><span>Podcasts</span><span>Tutorials</span><span>News</span></div>
  <div id="error"></div>

  <div id="loading"><div class="spin"></div><div id="loadmsg">Fetching the transcript...</div></div>

  <section id="out">
    <div class="video"><img id="thumb" alt=""><a id="vlink" target="_blank" rel="noopener"></a></div>
    <div class="summary" id="summary"></div>
    <div class="actions">
      <button class="ghost" id="dl-txt">Download .txt</button>
      <button class="ghost" id="dl-md">Download .md</button>
      <button class="ghost" id="copy">Copy</button>
    </div>
  </section>
  <footer>Summaries are AI-generated and can contain mistakes.</footer>
</main>
<script>
const $ = id => document.getElementById(id);
let summary = "", videoId = "summary", timer;

const esc = t => t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const inline = t => esc(t).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
function render(md) {
  let html = "", inList = false;
  for (const raw of md.split("\n")) {
    const line = raw.trim();
    const bullet = line.match(/^[-*]\s+(.*)/);
    if (bullet) { if (!inList) { html += "<ul>"; inList = true; } html += `<li>${inline(bullet[1])}</li>`; continue; }
    if (inList) { html += "</ul>"; inList = false; }
    if (line.startsWith("#")) html += `<h2>${inline(line.replace(/^#+\s*/,""))}</h2>`;
    else if (line) html += `<p>${inline(line)}</p>`;
  }
  return html + (inList ? "</ul>" : "");
}

function loading(on) {
  $("loading").style.display = on ? "block" : "none";
  $("go").disabled = on; $("go").textContent = on ? "Working..." : "Summarize";
  clearTimeout(timer);
  if (on) {
    $("loadmsg").textContent = "Fetching the transcript...";
    timer = setTimeout(() => $("loadmsg").textContent = "No captions found? Transcribing the audio, this can take a few minutes...", 8000);
  }
}

$("go").onclick = async () => {
  $("error").textContent = ""; $("out").style.display = "none"; loading(true);
  try {
    const res = await fetch("/api/summarize", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({url:$("url").value}) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Something went wrong.");
    summary = data.summary; videoId = data.video_id;
    $("thumb").src = `https://img.youtube.com/vi/${videoId}/mqdefault.jpg`;
    $("vlink").href = `https://www.youtube.com/watch?v=${videoId}`;
    $("vlink").textContent = `youtube.com/watch?v=${videoId}`;
    $("summary").innerHTML = render(summary);
    $("out").style.display = "block";
    $("out").scrollIntoView({behavior:"smooth", block:"start"});
  } catch (e) { $("error").textContent = e.message; }
  loading(false);
};
$("url").addEventListener("keydown", e => { if (e.key === "Enter") $("go").click(); });

function download(ext, mime) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([summary], {type:mime}));
  a.download = `summary-${videoId}.${ext}`; a.click(); URL.revokeObjectURL(a.href);
}
$("dl-txt").onclick = () => download("txt","text/plain");
$("dl-md").onclick = () => download("md","text/markdown");
$("copy").onclick = async () => { await navigator.clipboard.writeText(summary); $("copy").textContent = "Copied!"; setTimeout(() => $("copy").textContent = "Copy", 1500); };
</script>
</body>
</html>
